name: PR

# Fast gate for every pull request: lint, typecheck, unit, build, audit and the network-free compat
# checks. The isolated-consumer compatibility and five-platform consumer matrices are in
# plugin-preview.yml (manual dispatch and release tags).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint and format
        run: npx biome ci .
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npx vitest run --project unit
      - name: Install the browser for audit regressions
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm run build
      - name: Audit actual bundle and runtime dependency exposure
        run: |
          npm audit --json > .artifacts/npm-audit.json || test "$?" -eq 1
          node scripts/dependency-exposure.mjs --audit .artifacts/npm-audit.json --output .artifacts/dependency-exposure.json
      - name: Preserve bundle metrics and original dependency paths
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-metrics
          path: |
            packages/modern-ui/lib/build-metrics.json
            packages/modern-ui/lib/build-inputs.json
            .artifacts/build-metafiles/
            .artifacts/npm-audit.json
            .artifacts/dependency-exposure.json
      - name: Audit and compat regressions
        run: npx vitest run --project audit --project compat
        env:
          COMPAT_BACKEND_PACKAGE: node_modules/@deepseek-ai/dsh/package.json
